<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CBT BDR Sosiologi – SMAS Dharma Bakti Damparan</title>
<style>
:root{--bg:#f4efe6;--card:#fff;--tx:#2a2118;--mu:#6b5d4d;--ac:#a8721f;--ac2:#7b1f1f;--bd:#e3d6bf;--ok:#1b7f4a;--no:#b3261e}
:root[data-theme=dark]{--bg:#14110d;--card:#201b15;--tx:#f3eadb;--mu:#b9a98e;--ac:#e0a443;--ac2:#e5877d;--bd:#3a3125}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{max-width:640px;margin:0 auto;padding:14px 14px 84px;min-height:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:0 6px 24px rgba(80,50,10,.1);margin-bottom:12px}
h1,h2,h3{margin:.3em 0}h1{font-size:1.5rem;color:var(--ac2)}h2{font-size:1.2rem}.c{text-align:center}.mu{color:var(--mu);font-size:.9rem}
.btn{border:0;border-radius:12px;padding:13px 18px;font-size:1rem;font-weight:600;background:linear-gradient(135deg,var(--ac),#c98f2e);color:#fff;cursor:pointer;width:100%}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.45}.btn.r{background:var(--ac2)}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;margin:4px 0 10px;-webkit-user-select:text;user-select:text}
input:disabled,input[readonly]{opacity:.75;background:var(--bd)}label{font-size:.85rem;font-weight:600;color:var(--mu)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;cursor:pointer}
.logo{width:130px;height:auto;display:block;margin:6px auto;background:#fff;border-radius:50%;padding:8px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.steps{display:flex;gap:4px;margin-bottom:12px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--bd)}.steps i.on{background:var(--ac)}
ul.h{padding-left:20px;line-height:1.55;font-size:.95rem}
.cap{font-size:1.9rem;font-weight:800;text-align:center;letter-spacing:2px;padding:16px;background:var(--bg);border-radius:12px;color:var(--ac2)}
.bar{height:7px;background:var(--bd);border-radius:4px;overflow:hidden;margin:8px 0}.bar b{display:block;height:100%;background:var(--ac);transition:width 1s linear}
#foot{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:.78rem;font-weight:800;line-height:1.35;letter-spacing:.2px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(90deg,#4a0f0f,#8a1f1f,#4a0f0f);background-size:200% 100%;animation:sh 6s linear infinite;border-top:2px solid #e0a443;box-shadow:0 -4px 14px rgba(0,0,0,.3);color:#ffd77a;text-shadow:0 1px 2px rgba(0,0,0,.7);z-index:5;pointer-events:none}@keyframes sh{0%{background-position:0 0}100%{background-position:200% 0}}#foot b{color:#fff;letter-spacing:.4px}#foot .f2{font-size:.72rem;font-weight:700;opacity:.95;margin-top:1px}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-120px);background:var(--ac2);color:#fff;padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:50;transition:.35s;max-width:92%;text-align:center}#toast.on{transform:translateX(-50%)}
.q{font-size:1.05rem;line-height:1.5;margin:10px 0}.opt{display:block;width:100%;text-align:left;padding:12px;margin:7px 0;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:.98rem;cursor:pointer}.opt.sel{border-color:var(--ac);background:rgba(224,164,67,.2);font-weight:600}
.tm{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ac2);font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.grid button{padding:12px 0;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-weight:700}.grid .d{background:var(--ok);color:#fff}.grid .g{background:#e0a443;color:#000}.grid .cu{outline:3px solid var(--ac2)}
#cam{position:fixed;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));width:84px;height:110px;object-fit:cover;border-radius:12px;border:2px solid var(--ac);z-index:6;transform:scaleX(-1);background:#000}
.ov{position:fixed;inset:0;background:rgba(120,0,0,.94);color:#fff;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}.ov.on{display:flex}.ov .n{font-size:5rem;font-weight:900}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:flex-end;justify-content:center}.mod.on{display:flex}.mod>div{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px;max-height:80%;overflow:auto}
.blur #app{filter:blur(22px)}
table{width:100%;border-collapse:collapse;font-size:.8rem}td,th{border-bottom:1px solid var(--bd);padding:6px 3px;text-align:left}
.score{font-size:3.6rem;font-weight:900;color:var(--ac2);line-height:1}.kv{display:grid;grid-template-columns:110px 1fr;gap:4px;font-size:.9rem}.kv b{color:var(--mu)}
.kop{border-bottom:3px double var(--ac);padding-bottom:8px;margin-bottom:10px;text-align:center}
@media print{#foot,.noprint,#cam{display:none}}
</style></head><body>
